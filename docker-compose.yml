version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: weldix-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=weldix2024
      # URL que n8n usa para generar sus propios webhook URLs
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=Europe/Madrid

volumes:
  n8n_data:
