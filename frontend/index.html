<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/weldix-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fuentes cargadas vía Fontsource (self-hosted, GDPR compliant — sin llamadas a Google) -->
    <title>Weldix</title>
    <script>
      (function () {
        var t = localStorage.getItem('weldix_theme') || 'light'
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
