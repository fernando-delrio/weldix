name: Test & Lint

# Se ejecuta en cada push o PR a main y dev
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # DATABASE_URL vacío → SQLite en memoria (conftest.py lo gestiona)
        # PYTHONPATH=. permite que pytest encuentre el paquete backend desde la raíz
        run: pytest tests/ -v
        env:
          PYTHONPATH: "."
          SECRET_KEY: "ci-secret-key-not-used-in-production"
          DATABASE_URL: ""

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: "http://localhost:8000"
