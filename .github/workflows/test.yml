name: Test & Lint

# Se ejecuta en cada push o PR a main y dev
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cuando se implemente Alembic en Fase 10, descomentar esto:
      # - name: Run migrations
      #   run: alembic upgrade head
      #   env:
      #     DATABASE_URL: "sqlite:///./ci-test.db"

      - name: Run tests
        # DATABASE_URL en memoria → database.py crea un engine válido al importar.
        # Los tests usan su propio engine StaticPool (ver conftest.py), no este.
        # PYTHONPATH=. permite que pytest encuentre el paquete backend desde la raíz
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: "."
          SECRET_KEY: "ci-secret-key-not-used-in-production"
          DATABASE_URL: "sqlite:///:memory:"

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Format check (Prettier)
        run: cd frontend && npm run format:check

      - name: Lint (ESLint)
        run: cd frontend && npm run lint

      - name: Run tests (Vitest)
        run: cd frontend && npm run test:run

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: "http://localhost:8000"

      - name: Check bundle size
        # Budget: JS total < 512 KB gzip (Recharts añade ~80 KB para charts Fase 7, ~430 KB actual)
        # Target futuro < 150 KB inicial requiere lazy loading de rutas por feature
        run: |
          JS_BYTES=$(find frontend/dist/assets -name "*.js" ! -name "workbox-*" ! -name "sw.js" | xargs gzip -c | wc -c)
          JS_KB=$((JS_BYTES / 1024))
          echo "JS bundle size (gzip): ${JS_KB} KB"
          if [ "$JS_BYTES" -gt 524288 ]; then
            echo "ERROR: JS bundle exceeds 512 KB gzip budget (${JS_KB} KB)"
            exit 1
          fi
          echo "OK: bundle within budget"
